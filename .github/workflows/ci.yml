name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests benchmarks scripts
      - name: Tests (unit + end-to-end network)
        run: pytest -q
      - name: Cross-language test vectors are up to date
        run: python scripts/make_test_vectors.py --check

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Java SDK tests (incl. Python interop vectors)
        working-directory: java
        run: mvn -B -q test

  docker:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t sakshi .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name sakshi sakshi
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs -X POST localhost:8000/console/api/attacks/replay | grep -q '"outcome":"BLOCKED"'
