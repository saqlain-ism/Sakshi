[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sakshi"
version = "1.0.0"
description = "A trust layer for open commerce networks like ONDC: signed requests, non-repudiable receipts, a tamper-evident Merkle log, verifiable reputation and collusion detection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Saqlain Islam" }]
keywords = ["ondc", "beckn", "ed25519", "merkle-tree", "transparency-log", "non-repudiation", "reputation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Development Status :: 4 - Beta",
]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
analytics = ["numpy>=1.26", "scikit-learn>=1.4", "networkx>=3.2"]
network = ["sakshi[analytics]", "fastapi>=0.110", "uvicorn[standard]>=0.29", "redis>=5.0"]
dev = ["sakshi[network]", "pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.20", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/sakshi", "src/sakshi_network"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "benchmarks"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sakshi", "sakshi_network"]
